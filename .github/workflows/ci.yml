name: Validate HealthAssist
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select F backend api tests
      - run: ruff format --check backend api tests
      - run: pytest -q
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run build
      - name: Check frontend formatting
        working-directory: frontend
        run: npm exec -- prettier --check src package.json tsconfig.json vite.config.ts index.html
